# =============================================================================
# Docker 多架构镜像构建工作流
# =============================================================================
# 分支策略：
#   - test 分支：仅构建 AMD64(x86)，打 :test 标签，用于测试
#   - main 分支：并行构建 AMD64 + ARM64，最后合并为一个多架构镜像，
#                打 :{版本号} 与 :latest 标签
#
# 构建流程：
#   prepare ──┬──> build-amd64 ──┬──> create-manifest（合并为单个多架构镜像）
#             └──> build-arm64 ──┘
# =============================================================================

name: docker-build-push

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test

# GHCR 推送需要包写权限
permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: 准备构建参数（根据分支决定标签与是否构建 ARM）
  # ---------------------------------------------------------------------------
  prepare:
    name: 📋 准备构建参数
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prep.outputs.image_tag }}   # 主镜像标签(test 或 版本号)
      extra_tags: ${{ steps.prep.outputs.extra_tags }} # 额外标签(main 时为 latest)
      build_arm: ${{ steps.prep.outputs.build_arm }}   # 是否构建 ARM64
      version: ${{ steps.prep.outputs.version }}       # 版本号
      build_date: ${{ steps.prep.outputs.build_date }} # 构建时间
      dh_image: ${{ steps.prep.outputs.dh_image }}     # Docker Hub 镜像名
      ghcr_image: ${{ steps.prep.outputs.ghcr_image }} # GHCR 镜像名(全小写)
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析构建参数
        id: prep
        run: |
          VERSION=$(cat version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          # 镜像名：Docker Hub + GHCR（GHCR 名需全小写）
          echo "dh_image=${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot" >> $GITHUB_OUTPUT
          echo "ghcr_image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/dockercopilot" >> $GITHUB_OUTPUT
          # 分支策略
          if [ "${{ github.ref_name }}" = "test" ]; then
            # test 分支：仅构建 AMD64，打 :test
            echo "image_tag=test" >> $GITHUB_OUTPUT
            echo "extra_tags=" >> $GITHUB_OUTPUT
            echo "build_arm=false" >> $GITHUB_OUTPUT
          else
            # main 分支：双架构，打 :{版本号} + :latest
            echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "extra_tags=latest" >> $GITHUB_OUTPUT
            echo "build_arm=true" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Job 2: 构建 AMD64(x86) 镜像
  # ---------------------------------------------------------------------------
  build-amd64:
    name: 🔨 构建 AMD64
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 AMD64 镜像
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.prepare.outputs.dh_image }}:${{ needs.prepare.outputs.image_tag }}-amd64
            ${{ needs.prepare.outputs.ghcr_image }}:${{ needs.prepare.outputs.image_tag }}-amd64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}

  # ---------------------------------------------------------------------------
  # Job 3: 构建 ARM64 镜像（仅 main 分支，使用 QEMU 模拟，与 AMD64 并行）
  # ---------------------------------------------------------------------------
  build-arm64:
    name: 🔨 构建 ARM64
    needs: prepare
    if: needs.prepare.outputs.build_arm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ARM64 镜像
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ needs.prepare.outputs.dh_image }}:${{ needs.prepare.outputs.image_tag }}-arm64
            ${{ needs.prepare.outputs.ghcr_image }}:${{ needs.prepare.outputs.image_tag }}-arm64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}

  # ---------------------------------------------------------------------------
  # Job 4: 合并多架构 Manifest
  # ---------------------------------------------------------------------------
  # 将 AMD64 与 ARM64 镜像合并为一个多架构镜像（拉取时自动匹配架构）
  # test 分支只有 AMD64，则合并为单架构；main 分支合并双架构并追加 latest 标签
  # ---------------------------------------------------------------------------
  create-manifest:
    name: 📦 合并多架构 Manifest
    needs: [prepare, build-amd64, build-arm64]
    # always() 确保 ARM 被跳过(test 分支)时仍执行；但要求 AMD64 成功
    if: always() && needs.build-amd64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建并推送多架构 Manifest
        run: |
          TAG="${{ needs.prepare.outputs.image_tag }}"
          DH="${{ needs.prepare.outputs.dh_image }}"
          GHCR="${{ needs.prepare.outputs.ghcr_image }}"
          BUILD_ARM="${{ needs.prepare.outputs.build_arm }}"
          EXTRA_TAGS="${{ needs.prepare.outputs.extra_tags }}"

          if [[ "$BUILD_ARM" == "true" && "${{ needs.build-arm64.result }}" == "success" ]]; then
            echo "📦 合并双架构 manifest (AMD64 + ARM64)..."
            docker buildx imagetools create -t ${DH}:${TAG} \
              ${DH}:${TAG}-amd64 ${DH}:${TAG}-arm64
            docker buildx imagetools create -t ${GHCR}:${TAG} \
              ${GHCR}:${TAG}-amd64 ${GHCR}:${TAG}-arm64
            # 追加额外标签(如 latest)
            for EXTRA in $EXTRA_TAGS; do
              echo "📦 追加 ${EXTRA} 标签..."
              docker buildx imagetools create -t ${DH}:${EXTRA} \
                ${DH}:${TAG}-amd64 ${DH}:${TAG}-arm64
              docker buildx imagetools create -t ${GHCR}:${EXTRA} \
                ${GHCR}:${TAG}-amd64 ${GHCR}:${TAG}-arm64
            done
          else
            echo "📦 创建单架构 manifest (仅 AMD64)..."
            docker buildx imagetools create -t ${DH}:${TAG} ${DH}:${TAG}-amd64
            docker buildx imagetools create -t ${GHCR}:${TAG} ${GHCR}:${TAG}-amd64
          fi
          echo "✅ Manifest 创建完成！"
