# =============================================================================
# Docker 多架构镜像构建工作流
# =============================================================================
# 触发策略：
#   - test 分支 push：仅构建 AMD64(x86)，打 :test 标签，用于测试
#   - 推送 v* 标签：并行构建 AMD64 + ARM64，合并为多架构镜像，
#                   打 :{标签号} 与 :latest 标签。版本号直接取自 Git 标签名。
#     注意：向 main 分支 push 不再触发构建，需显式打标签才发正式版，
#     且标签必须位于 main 分支上（非 main 的标签会被拒绝）。
#
# 构建流程：
#   prepare ──┬──> build-amd64 ──┬──> create-manifest（合并为单个多架构镜像）
#             └──> build-arm64 ──┘
#
# 标签洁癖约定：
#   两个构建 job 均以 push-by-digest 方式推送（只推 digest，不打任何 tag），
#   且只推 Docker Hub 一个仓库；manifest 阶段再用 digest 引用创建最终标签，
#   GHCR 的标签由 imagetools 跨 registry 拷贝生成。因此仓库中永远不会出现
#   :xxx-amd64 / :xxx-arm64 这类中间标签，只保留 :{版本号}、:latest、:test。
#
# 失败语义：
#   正式版要求 ARM64 必须构建成功，否则 manifest 阶段直接失败，
#   不会把仅含 AMD64 的镜像伪装成多架构镜像发布出去；
#   最后一步会逐个 inspect 最终标签，架构组成与预期不符即失败。
# =============================================================================

name: docker-build-push

on:
  workflow_dispatch:
  push:
    # main 分支不在此列：正式版由打标签触发，而非合入 main 即构建
    branches:
      - test
    tags:
      - 'v*'

# GHCR 推送需要包写权限
permissions:
  contents: read
  packages: write

# 镜像名用顶层 env 定义（含 secret 的值不能通过 job output 跨 job 传递，
# 否则会被 Actions 的 secret 保护机制清空，导致 tag 变成 ":xxx" 触发 invalid reference）。
env:
  # Docker Hub 镜像名
  DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot
  # GHCR 镜像名（owner 可能含大写，登录/推送前在步骤内转小写）
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/dockercopilot

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: 准备构建参数（根据分支决定标签与是否构建 ARM）
  # ---------------------------------------------------------------------------
  prepare:
    name: 📋 准备构建参数
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prep.outputs.image_tag }}   # 主镜像标签(test 或 v版本号)
      extra_tags: ${{ steps.prep.outputs.extra_tags }} # 额外标签(正式版为 latest)
      build_arm: ${{ steps.prep.outputs.build_arm }}   # 是否构建 ARM64
      version: ${{ steps.prep.outputs.version }}       # 版本号
      build_date: ${{ steps.prep.outputs.build_date }} # 构建时间
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要完整历史与所有分支引用，才能校验标签是否位于 main 分支
          fetch-depth: 0

      - name: 解析构建参数
        id: prep
        run: |
          set -euo pipefail
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # ---- 标签触发：正式版，版本号即标签号，双架构 ----
            TAG_NAME="${{ github.ref_name }}"

            # 校验标签格式：v 开头的语义化版本，可带 -rc.1 之类后缀
            if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
              echo "❌ 标签格式非法：${TAG_NAME}，要求形如 v1.2.3 或 v1.2.3-rc.1"
              exit 1
            fi

            # 校验标签必须位于 main 分支，避免从旧分支或功能分支误发正式版
            if ! git branch -r --contains "${{ github.sha }}" | grep -qE 'origin/main$'; then
              echo "❌ 标签 ${TAG_NAME} 所指提交不在 main 分支上，拒绝构建正式版"
              exit 1
            fi

            # 版本号即标签名，保留 v 前缀（与 version 文件既有格式一致）
            VERSION="${TAG_NAME}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "image_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "extra_tags=latest" >> $GITHUB_OUTPUT
            echo "build_arm=true" >> $GITHUB_OUTPUT
            echo "✅ 正式版构建：标签 ${TAG_NAME}，版本号 ${VERSION}，双架构"
          else
            # ---- 分支触发：仅允许 test 分支，产出测试版 ----
            # workflow_dispatch 从非 test 分支手动触发时在此拦下，
            # 避免把 main 的代码误发成 :test 标签。
            if [ "${{ github.ref_name }}" != "test" ]; then
              echo "❌ 分支 ${{ github.ref_name }} 不支持直接构建；正式版请打 v* 标签"
              exit 1
            fi
            # 测试版：仅 AMD64，版本号取自 version 文件并加 -test 后缀
            VERSION="$(cat version)-test"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "image_tag=test" >> $GITHUB_OUTPUT
            echo "extra_tags=" >> $GITHUB_OUTPUT
            echo "build_arm=false" >> $GITHUB_OUTPUT
            echo "✅ 测试版构建：标签 test，版本号 ${VERSION}，仅 AMD64"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: 构建 AMD64(x86) 镜像
  # ---------------------------------------------------------------------------
  build-amd64:
    name: 🔨 构建 AMD64
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}  # 镜像 digest，供 manifest 合并使用
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 按 digest 推送（push-by-digest），不打任何 tag，避免中间标签污染仓库。
      # 注意：build-push-action 会对 outputs 做 CSV 解析并剥掉引号，
      # 因此 name= 只能写单个镜像名（写两个会被拆成非法字段）。
      # 这里只推 Docker Hub，GHCR 的标签在 manifest 阶段由 imagetools 跨 registry 创建。
      - name: 构建并按 digest 推送 AMD64 镜像
        id: build
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.DH_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}

  # ---------------------------------------------------------------------------
  # Job 3: 构建 ARM64 镜像（仅标签触发的正式版，与 AMD64 并行）
  # Dockerfile 中前端与 Go 编译阶段固定在原生 amd64 上跑（--platform=$BUILDPLATFORM），
  # Go 交叉编译出 arm64 二进制；QEMU 仅用于最后一层轻量运行时镜像。
  # ---------------------------------------------------------------------------
  build-arm64:
    name: 🔨 构建 ARM64
    needs: prepare
    if: needs.prepare.outputs.build_arm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}  # 镜像 digest，供 manifest 合并使用
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 按 digest 推送，不打 tag（同 AMD64，只推 Docker Hub）
      - name: 构建并按 digest 推送 ARM64 镜像
        id: build
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ env.DH_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}

  # ---------------------------------------------------------------------------
  # Job 4: 合并多架构 Manifest
  # ---------------------------------------------------------------------------
  # 将 AMD64 与 ARM64 镜像合并为一个多架构镜像（拉取时自动匹配架构）
  # test 分支只有 AMD64，则合并为单架构；标签触发合并双架构并追加 latest 标签
  # ---------------------------------------------------------------------------
  create-manifest:
    name: 📦 合并多架构 Manifest
    needs: [prepare, build-amd64, build-arm64]
    # always() 让 ARM 被跳过(test 分支)时仍能执行；
    # 但正式版要求 ARM 必须成功——ARM 失败时不再静默降级为单架构发布，
    # 具体判定在步骤内基于 build_arm 与 ARM digest 是否存在完成。
    if: always() && needs.build-amd64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用 digest 引用创建最终标签。构建阶段只按 digest 推到 Docker Hub，
      # 从未打过 tag，因此仓库里只会出现最终标签(版本号 / latest / test)。
      # GHCR 的标签同样以 Docker Hub 的 digest 为源，由 imagetools 跨 registry 拷贝 blob。
      - name: 创建并推送多架构 Manifest
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.image_tag }}"
          DH="${{ env.DH_IMAGE }}"
          # GHCR 名转小写（owner 可能含大写）
          GHCR="$(echo '${{ env.GHCR_IMAGE }}' | tr '[:upper:]' '[:lower:]')"
          BUILD_ARM="${{ needs.prepare.outputs.build_arm }}"
          EXTRA_TAGS="${{ needs.prepare.outputs.extra_tags }}"
          AMD_DIGEST="${{ needs.build-amd64.outputs.digest }}"
          ARM_DIGEST="${{ needs.build-arm64.outputs.digest }}"

          # 校验 AMD64 digest 必须存在
          if [ -z "$AMD_DIGEST" ]; then
            echo "❌ AMD64 digest 为空，构建产物异常"
            exit 1
          fi

          # 组装参与合并的 digest 引用列表（源统一为 Docker Hub）
          if [ "$BUILD_ARM" = "true" ]; then
            # 正式版：ARM64 必须成功，缺失则直接失败，绝不降级为单架构发布
            if [ -z "$ARM_DIGEST" ]; then
              echo "❌ 需要双架构但 ARM64 digest 为空，中止发布"
              exit 1
            fi
            echo "📦 合并双架构 manifest (AMD64 + ARM64)"
            SRCS="${DH}@${AMD_DIGEST} ${DH}@${ARM_DIGEST}"
            EXPECT_ARCHS="amd64 arm64"
          else
            # test 分支：设计上只构建 AMD64，产出单架构镜像
            echo "📦 创建单架构 manifest (仅 AMD64)"
            SRCS="${DH}@${AMD_DIGEST}"
            EXPECT_ARCHS="amd64"
          fi
          echo "EXPECT_ARCHS=${EXPECT_ARCHS}" >> $GITHUB_ENV

          # 主标签 + 额外标签(如 latest)统一处理
          for T in ${TAG} ${EXTRA_TAGS}; do
            echo "🏷️  创建标签 ${T}"
            docker buildx imagetools create -t ${DH}:${T} ${SRCS}
            docker buildx imagetools create -t ${GHCR}:${T} ${SRCS}
          done
          echo "✅ Manifest 创建完成"

      # 逐个校验最终标签的架构组成，与预期不符则失败，
      # 防止"绿色构建但镜像架构缺失"的情况再次发生。
      - name: 校验最终标签架构
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.image_tag }}"
          EXTRA_TAGS="${{ needs.prepare.outputs.extra_tags }}"
          DH="${{ env.DH_IMAGE }}"
          GHCR="$(echo '${{ env.GHCR_IMAGE }}' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(echo ${EXPECT_ARCHS} | tr ' ' '\n' | sort | tr '\n' ' ')"

          for IMG in ${DH} ${GHCR}; do
            for T in ${TAG} ${EXTRA_TAGS}; do
              ACTUAL="$(docker buildx imagetools inspect ${IMG}:${T} \
                --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}' \
                | tr ' ' '\n' | grep -v '^$' | grep -v unknown | sort -u | tr '\n' ' ')"
              echo "🔍 ${IMG}:${T} → ${ACTUAL}"
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "❌ 架构不符，期望 [${EXPECTED}] 实际 [${ACTUAL}]"
                exit 1
              fi
            done
          done
          echo "✅ 所有标签架构校验通过"
