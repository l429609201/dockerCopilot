name: docker-build-push

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test

# GHCR 推送需要包写权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 读取版本号并根据分支决定镜像标签，同时推送 Docker Hub 与 GHCR：
      #   test 分支 -> :test
      #   其他分支(main) -> :{版本号} + :latest
      - name: Resolve tags
        id: meta
        run: |
          VERSION=$(cat version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          DH="${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot"
          # GHCR 镜像名需全小写
          GHCR="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/dockercopilot"
          if [ "${{ github.ref_name }}" = "test" ]; then
            echo "tags=${DH}:test,${GHCR}:test" >> $GITHUB_OUTPUT
          else
            echo "tags=${DH}:${VERSION},${DH}:latest,${GHCR}:${VERSION},${GHCR}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 多阶段 Dockerfile 内部已完成前端构建 + 后端 embed 编译
      - name: Build and push Docker images
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
