# =============================================================================
# Docker 多架构镜像构建工作流
# =============================================================================
# 分支策略：
#   - test 分支：仅构建 AMD64(x86)，打 :test 标签，用于测试
#   - main 分支：并行构建 AMD64 + ARM64，最后合并为一个多架构镜像，
#                打 :{版本号} 与 :latest 标签
#
# 构建流程：
#   prepare ──┬──> build-amd64 ──┬──> create-manifest（合并为单个多架构镜像）
#             └──> build-arm64 ──┘
#
# 标签洁癖约定：
#   两个构建 job 均以 push-by-digest 方式推送（只推 digest，不打任何 tag），
#   manifest 阶段再用 digest 引用创建最终标签。因此仓库中永远不会出现
#   :xxx-amd64 / :xxx-arm64 这类中间标签，只保留 :{版本号}、:latest、:test。
#
# 失败语义：
#   main 分支要求 ARM64 必须构建成功，否则 manifest 阶段直接失败，
#   不会把仅含 AMD64 的镜像伪装成多架构镜像发布出去。
# =============================================================================

name: docker-build-push

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test

# GHCR 推送需要包写权限
permissions:
  contents: read
  packages: write

# 镜像名用顶层 env 定义（含 secret 的值不能通过 job output 跨 job 传递，
# 否则会被 Actions 的 secret 保护机制清空，导致 tag 变成 ":xxx" 触发 invalid reference）。
env:
  # Docker Hub 镜像名
  DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot
  # GHCR 镜像名（owner 可能含大写，登录/推送前在步骤内转小写）
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/dockercopilot

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: 准备构建参数（根据分支决定标签与是否构建 ARM）
  # ---------------------------------------------------------------------------
  prepare:
    name: 📋 准备构建参数
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prep.outputs.image_tag }}   # 主镜像标签(test 或 版本号)
      extra_tags: ${{ steps.prep.outputs.extra_tags }} # 额外标签(main 时为 latest)
      build_arm: ${{ steps.prep.outputs.build_arm }}   # 是否构建 ARM64
      version: ${{ steps.prep.outputs.version }}       # 版本号
      build_date: ${{ steps.prep.outputs.build_date }} # 构建时间
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析构建参数
        id: prep
        run: |
          VERSION=$(cat version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          # 分支策略
          if [ "${{ github.ref_name }}" = "test" ]; then
            # test 分支：仅构建 AMD64，打 :test
            echo "image_tag=test" >> $GITHUB_OUTPUT
            echo "extra_tags=" >> $GITHUB_OUTPUT
            echo "build_arm=false" >> $GITHUB_OUTPUT
          else
            # main 分支：双架构，打 :{版本号} + :latest
            echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "extra_tags=latest" >> $GITHUB_OUTPUT
            echo "build_arm=true" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Job 2: 构建 AMD64(x86) 镜像
  # ---------------------------------------------------------------------------
  build-amd64:
    name: 🔨 构建 AMD64
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}  # 镜像 digest，供 manifest 合并使用
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算小写 GHCR 镜像名
        id: img
        run: echo "ghcr=$(echo '${{ env.GHCR_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 按 digest 推送（push-by-digest），不打任何 tag，避免中间标签污染仓库。
      # 同一份内容推送到两个 registry，digest 相同，故只需一个 digest 输出。
      - name: 构建并按 digest 推送 AMD64 镜像
        id: build
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          outputs: type=image,"name=${{ env.DH_IMAGE }},${{ steps.img.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}

  # ---------------------------------------------------------------------------
  # Job 3: 构建 ARM64 镜像（仅 main 分支，与 AMD64 并行）
  # Dockerfile 中前端与 Go 编译阶段固定在原生 amd64 上跑（--platform=$BUILDPLATFORM），
  # Go 交叉编译出 arm64 二进制；QEMU 仅用于最后一层轻量运行时镜像。
  # ---------------------------------------------------------------------------
  build-arm64:
    name: 🔨 构建 ARM64
    needs: prepare
    if: needs.prepare.outputs.build_arm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}  # 镜像 digest，供 manifest 合并使用
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 计算小写 GHCR 镜像名
        id: img
        run: echo "ghcr=$(echo '${{ env.GHCR_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 按 digest 推送，不打 tag（同 AMD64）
      - name: 构建并按 digest 推送 ARM64 镜像
        id: build
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          outputs: type=image,"name=${{ env.DH_IMAGE }},${{ steps.img.outputs.ghcr }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}

  # ---------------------------------------------------------------------------
  # Job 4: 合并多架构 Manifest
  # ---------------------------------------------------------------------------
  # 将 AMD64 与 ARM64 镜像合并为一个多架构镜像（拉取时自动匹配架构）
  # test 分支只有 AMD64，则合并为单架构；main 分支合并双架构并追加 latest 标签
  # ---------------------------------------------------------------------------
  create-manifest:
    name: 📦 合并多架构 Manifest
    needs: [prepare, build-amd64, build-arm64]
    # always() 让 ARM 被跳过(test 分支)时仍能执行；
    # 但 main 分支要求 ARM 必须成功——ARM 失败时不再静默降级为单架构发布，
    # 具体判定在步骤内基于 build_arm 与 ARM digest 是否存在完成。
    if: always() && needs.build-amd64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用 digest 引用创建 manifest。digest 由构建 job 输出，
      # 镜像本身未打过 tag，因此仓库里只会出现最终标签(版本号 / latest / test)。
      - name: 创建并推送多架构 Manifest
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.image_tag }}"
          DH="${{ env.DH_IMAGE }}"
          # GHCR 名转小写（owner 可能含大写）
          GHCR="$(echo '${{ env.GHCR_IMAGE }}' | tr '[:upper:]' '[:lower:]')"
          BUILD_ARM="${{ needs.prepare.outputs.build_arm }}"
          EXTRA_TAGS="${{ needs.prepare.outputs.extra_tags }}"
          AMD_DIGEST="${{ needs.build-amd64.outputs.digest }}"
          ARM_DIGEST="${{ needs.build-arm64.outputs.digest }}"

          # 校验 AMD64 digest 必须存在
          if [ -z "$AMD_DIGEST" ]; then
            echo "❌ AMD64 digest 为空，构建产物异常"
            exit 1
          fi

          # 组装参与合并的 digest 引用列表
          if [ "$BUILD_ARM" = "true" ]; then
            # main 分支：ARM64 必须成功，缺失则直接失败，绝不降级为单架构发布
            if [ -z "$ARM_DIGEST" ]; then
              echo "❌ 需要双架构但 ARM64 digest 为空，中止发布"
              exit 1
            fi
            echo "📦 合并双架构 manifest (AMD64 + ARM64)"
            DH_SRCS="${DH}@${AMD_DIGEST} ${DH}@${ARM_DIGEST}"
            GHCR_SRCS="${GHCR}@${AMD_DIGEST} ${GHCR}@${ARM_DIGEST}"
          else
            # test 分支：设计上只构建 AMD64
            echo "📦 创建单架构 manifest (仅 AMD64)"
            DH_SRCS="${DH}@${AMD_DIGEST}"
            GHCR_SRCS="${GHCR}@${AMD_DIGEST}"
          fi

          # 主标签 + 额外标签(如 latest)统一处理
          for T in ${TAG} ${EXTRA_TAGS}; do
            echo "🏷️  创建标签 ${T}"
            docker buildx imagetools create -t ${DH}:${T} ${DH_SRCS}
            docker buildx imagetools create -t ${GHCR}:${T} ${GHCR_SRCS}
          done
          echo "✅ Manifest 创建完成"

      - name: 校验多架构 Manifest
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.image_tag }}"
          DH="${{ env.DH_IMAGE }}"
          echo "🔍 ${DH}:${TAG} 包含的架构："
          docker buildx imagetools inspect ${DH}:${TAG} \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}'
